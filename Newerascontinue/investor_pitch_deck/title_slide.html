<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background: #1a2b3c;
        color: #ffffff;
        font-family: 'Arial', sans-serif;
      }
      .content-container {
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 720px;
      }
      .title {
        font-size: 72px;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: center;
      }
      .subtitle {
        font-size: 36px;
        color: #e0e0e0;
        margin-bottom: 20px;
        text-align: center;
      }
      .tagline {
        font-size: 24px;
        color: #4a90e2;
        margin-top: 20px;
        text-align: center;
      }
      .image-container {
        max-width: 500px;
        margin: 10px 0;
      }
      .image-container img {
        width: 100%;
        height: auto;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="slide-container">
      <div class="content-container">
        <h1 class="title">Global AI Marketplace</h1>
        <h2 class="subtitle">Series A Investment Opportunity</h2>
        
        <div class="image-container">
          <img src="/home/ubuntu/upload/search_images/clYenL7jJREZ.jpg" alt="AI Marketplace Concept" width="500" height="333">
        </div>
        
        <p class="tagline">Transforming E-Commerce with AI-Driven Pricing, Content Safety, and Optimized Logistics</p>
        
        <div class="mt-8 text-e0e0e0">
          <p class="text-xl">$25M Series A at $100M Pre-Money Valuation</p>
          <p class="text-lg mt-1">August 2025</p>
        </div>
      </div>
    </div>
  </body>
</html>
